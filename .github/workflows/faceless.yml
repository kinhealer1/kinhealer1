name: Faceless YouTube video

on:
  schedule:
    - cron: "17 14 * * *" # daily at 14:17 UTC; add more lines for more uploads per day
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (blank = queue / topics.txt / random Wikipedia)"
        required: false
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: faceless

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Make video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TOPIC: ${{ github.event.inputs.topic }}
          WANT_UPLOAD: ${{ github.event_name == 'schedule' || github.event.inputs.upload == 'true' }}
        run: |
          args=(run)
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
          if [ "$WANT_UPLOAD" = "true" ] && [ -n "$YT_REFRESH_TOKEN" ]; then args+=(--upload); fi
          python -m faceless "${args[@]}"

      - name: Keep the video for 7 days (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/
          retention-days: 7

      - name: Save queue and history
        run: |
          git config user.name "faceless-bot"
          git config user.email "faceless-bot@users.noreply.github.com"
          git add -A history.jsonl topics.txt scripts/
          git diff --cached --quiet || git commit -m "chore: record published video [skip ci]"
          git push
