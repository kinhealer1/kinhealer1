name: Faceless test render (no upload)

# Renders one video and saves it as a downloadable artifact. Never uploads to YouTube.
on:
  push:
    branches: ["claude/faceless-youtube-automation-*"]
    paths: ["faceless/**", "channel.yaml", "requirements.txt", ".github/workflows/faceless-test.yml"]
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to render"
        default: "The Great Emu War of 1932"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
      - run: pip install -r requirements.txt
      - name: Render
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic || 'The Great Emu War of 1932' }}
        run: |
          echo "Pexels key set: ${PEXELS_API_KEY:+yes}  Gemini key set: ${GEMINI_API_KEY:+yes}"
          python -m faceless run --topic "$TOPIC"
      - uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: output/
          retention-days: 7
